[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dementia-typer"
version = "0.1.0"
description = "Dementia subtype classification from OASIS-3 clinical and MRI data"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Krishna Annavaram" }]
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "pydantic>=2.5",
]

[project.optional-dependencies]
explain = ["shap>=0.44"]
dev = ["pytest>=8"]

[project.scripts]
dementia-typer = "dementia_typer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
